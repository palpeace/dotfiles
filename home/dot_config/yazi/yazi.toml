[mgr]
ratio          = [ 1, 2, 7 ]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5

[preview]
tab_size        = 2
max_width       = 1000
max_height      = 1000
image_filter    = "triangle"
image_quality   = 75

# git.yazi: ファイル一覧に git のステータス記号 (M/A/D/? など) を常時表示する
[[plugin.prepend_fetchers]]
url   = "*"
run   = "git"
group = "git"

[[plugin.prepend_fetchers]]
url   = "*/"
run   = "git"
group = "git"
