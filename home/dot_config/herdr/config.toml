onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true
# 既定は true で、タブを作るたびに名前を聞かれる。prefix+c を1手にする。
prompt_new_tab_name = false

[ui.toast]
delivery = "system"

[keys]
# ctrl+b は隣接キーの誤爆でセッションに ctrl+c (SIGINT) を送りかねないため ctrl+space に変更。
# prefix だけは配列非対応（"expected a string" で拒否される。実測済み）。
prefix = "ctrl+space"

# --- (1) 既定に無い動作 ---
# 既定にある動作を別のキーへ移し替えない —— prefix+? のヘルプも公式ドキュメントも
# 映すのは既定なので、上書きした分だけ「ヘルプに書いていないことを覚える」負債になる
# （2026-09-01、PO承認）。以前あった new_tab / split_* / close_pane の shift 上乗せは撤去した。

# ワークスペースに番号で直接ジャンプ（既定は未設定でpicker経由のみ）
switch_workspace = "prefix+shift+1..9"
# エージェントに番号で直接ジャンプ。alt+数字は修飾付きなので全角入力中も IME を素通りする
focus_agent = "prefix+alt+1..9"

# --- (2) 全角入力中の逃げ道: 同じ文字を ctrl+alt でも受ける ---
# prefix の次に押す「素の文字」は、全角のとき Windows 側の IME が変換バッファに
# 吸い込むので herdr まで届かない。IME は Windows、herdr の client は WSL の Linux
# バイナリなので、設定でも experimental.switch_ascii_input_source_in_prefix でも触れない
# （後者はそもそも macOS/Windows 限定、かつ Windows では韓国語IMEしか動かさない）。
# prefix / navigate / resize の「モード」は3つとも同じ弱点を持つ。
#
# 修飾付きの打鍵は IME を素通りするので、押す文字はそのままに ctrl+alt を足した
# 直接バインドを併記する。覚えるのは「全角のときは prefix の代わりに ctrl+alt」の1つだけ。
# 併記できるのは、アクションのキーが配列を取るから（既定設定には出てこないが受理され、
# 配列の各要素は個別に検証される。実測）。
#
# F6〜F10 は使わない —— 変換中の IME が予約している（ひらがな/カタカナ/半角変換）。
# ctrl+<文字> 単独も使わない —— ペインの中のシェルやTUIから奪ってしまう。
# 数字系は触らない —— タブは ctrl+alt+n / ctrl+alt+p、ワークスペースは ctrl+alt+w の
# picker（矢印キーは IME を素通りする）、エージェントは prefix+alt+数字 で既に届く。
new_tab = ["prefix+c", "ctrl+alt+c"]
close_pane = ["prefix+x", "ctrl+alt+x"]
split_vertical = ["prefix+v", "ctrl+alt+v"]
split_horizontal = ["prefix+minus", "ctrl+alt+minus"]
focus_pane_left = ["prefix+h", "ctrl+alt+h"]
focus_pane_down = ["prefix+j", "ctrl+alt+j"]
focus_pane_up = ["prefix+k", "ctrl+alt+k"]
focus_pane_right = ["prefix+l", "ctrl+alt+l"]
previous_tab = ["prefix+p", "ctrl+alt+p"]
next_tab = ["prefix+n", "ctrl+alt+n"]
zoom = ["prefix+z", "ctrl+alt+z"]
workspace_picker = ["prefix+w", "ctrl+alt+w"]

# 直前にフォーカスしていたペインへワークスペースを跨いで戻る（既定は未設定）
last_pane = ["prefix+u", "ctrl+alt+u"]

# 差分とファイルツリーを1打鍵で開く。「新規タブ→gu/y→抜ける→タブを閉じる」の4手を畳む。
# 既定が使っていない無シフト文字から選ぶ（空きは a d f i m y）。
# `herdr config check` は衝突を検出しない（prefix+z に被せても ok が返る。実測）ので
# 空きの判定は人がやるしかない。
# cwd の解決と yazi の cd 送り返しは herdr-here が担う（[[keys.command]] に cwd は無い）。
[[keys.command]]
key = ["prefix+d", "ctrl+alt+d"]
type = "popup"
command = "herdr-here gitui"
width = "90%"
height = "90%"
description = "Git diff (gitui)"

[[keys.command]]
key = ["prefix+f", "ctrl+alt+f"]
type = "popup"
command = "herdr-here yazi"
width = "90%"
height = "90%"
description = "File tree (yazi)"
