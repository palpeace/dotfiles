[tools]
# 1. ランタイム（メジャー固定）
rust = "stable"
go = "1.24"
node = "lts"
python = "3.12"

# 2. Shell / Navigation (latest)
"aqua:rossmacarthur/sheldon" = "latest"  # Zsh プラグイン管理
starship = "latest"   # プロンプト
atuin = "latest"      # シェル履歴の検索と同期
zoxide = "latest"     # ディレクトリ移動
fzf = "latest"        # インタラクティブ検索
"aqua:tldr-pages/tlrc" = "latest"  # tldr 高速参照

# 3. Core CLI (latest)
ripgrep = "latest"    # テキスト検索
"aqua:sharkdp/fd" = "latest"  # ファイル検索
bat = "latest"        # 構文ハイライト付き pager
eza = "latest"        # ls 代替
jq = "latest"         # JSON 処理
"npm:trash-cli" = "latest"  # ゴミ箱経由削除

# 4. Git (latest)
github-cli = "latest"  # GitHub CLI (gh)
lazygit = "latest"     # Git TUI
delta = "latest"       # diff 視認性改善

# 5. Package Managers / Task Runner
uv = "latest"          # Python パッケージ管理
"npm:pnpm" = "latest"  # Node パッケージ管理
just = "latest"        # 定型タスクランナー

# 6. Network / Containers / System
xh = "latest"          # HTTP クライアント
lazydocker = "latest"  # Docker TUI
bottom = "latest"      # システム監視
dust = "latest"        # ディレクトリ容量可視化
tmux = "latest"        # ターミナル multiplexer
helix = "latest"       # ターミナルエディタ

# 7. AI CLI (mise 管理)
"npm:@github/copilot" = "latest"

# 8. Formatting / LSP (エディタ連携用)
"npm:prettier" = "3"   # 汎用 formatter (メジャー固定)
"npm:markdownlint-cli2" = "latest"  # Markdown lint
"aqua:tamasfe/taplo" = "latest"  # TOML formatter / LSP
"aqua:artempyanykh/marksman" = "latest"  # Markdown LSP
"npm:pyright" = "latest"  # Python LSP
"go:golang.org/x/tools/gopls" = "latest"  # Go LSP

[settings]
all_compile = false

