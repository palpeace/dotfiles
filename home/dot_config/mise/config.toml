[tools]
# 1. ランタイム（メジャー/マイナー固定）
rust = "stable"
go = "1.24"
node = "lts"
python = "3.12"

# 2. Shell / Navigation
"aqua:rossmacarthur/sheldon" = "0.8.5"  # Zsh プラグイン管理
starship = "1.26.0"   # プロンプト
atuin = "18.17.1"      # シェル履歴の検索と同期
zoxide = "0.10.0"     # ディレクトリ移動
fzf = "0.74.1"        # インタラクティブ検索
"aqua:herdrdev/herdr" = "0.8.0"  # 複数AIコーディングエージェントの並行監督用ターミナル


# 3. Core CLI
ripgrep = "15.2.0"    # テキスト検索
"aqua:sharkdp/fd" = "10.4.2"  # ファイル検索
bat = "0.26.1"        # 構文ハイライト付き pager
eza = "0.23.5"        # ls 代替
jq = "1.8.2"          # JSON 処理
# ゴミ箱経由削除。FreeDesktop 準拠の Python 実装。
# 旧 npm:trash-cli は WSL を検知して powershell.exe を呼びに行き、interop の無い
# 環境では ENOENT で落ちて「消したつもりで消えていない」状態を作るため置き換えた。
"pipx:trash-cli" = "0.24.5.26"  # trash-put / trash-list / trash-restore / trash-empty

# 4. Git
github-cli = "2.96.0"  # GitHub CLI (gh)
"aqua:extrawurst/gitui" = "0.26.3"  # Git TUI
delta = "0.19.2"       # diff 視認性改善

# 5. Package Managers / Task Runner
uv = "0.11.31"          # Python パッケージ管理
"npm:pnpm" = "11.16.0"  # Node パッケージ管理
just = "1.57.0"        # 定型タスクランナー

# 6. Network / Containers / System
xh = "0.26.1"          # HTTP クライアント
"aqua:mrjackwills/oxker" = "0.13.3"  # Docker TUI
bottom = "0.14.6"      # システム監視
dust = "1.2.4"         # ディレクトリ容量可視化
"aqua:sxyazi/yazi" = "26.8.15"    # IDEのサイドバー代わりのTUIファイラ
"aqua:zyedidia/micro" = "2.0.15"  # 司令塔用軽量エディタ

# 7. AI CLI (mise 管理)
"npm:@github/copilot" = "1.0.73"  # 外部レビュワー用LLM基盤



# 8. Formatting (CLI / AI用)
"npm:prettier" = "3.9.6"   # 汎用 formatter
"npm:markdownlint-cli2" = "0.23.1"  # Markdown lint
pandoc = "3.7.0.2"          # docx/pptx等の原本をmdへ機械変換（AKM sources/ 取り込み用）

[settings]
all_compile = false
