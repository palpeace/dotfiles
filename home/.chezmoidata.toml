# chezmoi のテンプレートから見える既定値。**機械ごとの答えは config が持つ**
# （`.chezmoi.toml.tmpl` が `chezmoi init` で聞き、`~/.config/chezmoi/chezmoi.toml`
# に焼く）。ここに置くのは「聞かれていない機械での既定」だけで、config 側の
# `[data]` が常に優先される。
#
# 既定は全て false —— 入れるかどうかを聞かれていない機械に、勝手に増やさない。

# LAN内の別PCから ssh で入るための sshd を、この機械に入れるか。
# 実体は home/.chezmoiscripts/run_onchange_after_30-setup-ssh.sh.tmpl
ssh_server = false
